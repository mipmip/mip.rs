[package]
name = "mip"
version = "0.4.2"
edition = "2024"

[dependencies]
gtk4 = "0.11"
webkit6 = "0.6"
tokio = { version = "1", features = ["full"] }
warp = { version = "0.3" }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
notify = { version = "7" }
rust-embed = { version = "8" }
rand = "0.9"
gray_matter = "0.2"
argh = "0.1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util", "macros"] }

[package.metadata.deb]
maintainer = "Pim Snel <post@pimsnel.com>"
copyright = "2022-2026, Pim Snel"
license-file = ["LICENSE", "0"]
extended-description = "Fast, bloatless markdown document viewer using GTK4 and WebKitGTK. Renders markdown in a webview with live reload, dark mode, table of contents, and Ctrl+P printing."
section = "text"
priority = "optional"
depends = "$auto, libgtk-4-1, libwebkitgtk-6.0-4, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad"
assets = [
    ["target/release/mip", "usr/bin/", "755"],
]
